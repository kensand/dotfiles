# ─────────────────────────────────────────────────────────────────────────────
# dotfiles :: tty — tmux for TTY / SSH sessions
#
# Installed as ~/.tmux.conf by bin/setup-tty.sh. This is deliberately NOT the
# desktop config (gpakosz/.tmux plus sessionist and sidebar): a config that
# run-shells files which are not there breaks loudest on exactly the machine you
# need it on. Every option below is stock tmux, so this file works on a four-
# year-old LTS release with nothing installed but tmux itself.
#
# Reload after editing:  prefix + :  then  source-file ~/.tmux.conf
# ─────────────────────────────────────────────────────────────────────────────

# Screen-style second prefix, matching the desktop config's muscle memory. C-b
# keeps working too. Delete these two lines for pure tmux defaults.
set -g prefix2 C-a
bind C-a send-prefix -2

# Escape sequences finish quickly. At tmux's 500ms default, a lone ESC in vim
# over a slow link burns half a second and swallows the key that follows it.
set -s escape-time 10

# tmux-256color is the accurate one but needs the terminfo entry on this host;
# screen-256color is present essentially everywhere.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
	'set -g default-terminal "tmux-256color"' \
	'set -g default-terminal "screen-256color"'

# Scrollback. The default 2000 lines is gone before you finish reading a build log.
set -g history-limit 10000

# Number windows and panes from 1 and close the gaps when one dies, so "window
# 3" means the same thing on every machine.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Ctrl-arrows and friends. Already the default in tmux >= 3.0; kept because the
# host you SSH into is often older than the machine you left.
setw -g xterm-keys on

# Size the window to the smallest attached client, not to whoever attached
# first — otherwise a second laptop shrinks nothing and you get cut-off panes.
setw -g aggressive-resize on

# Wheel scrolls the history instead of the shell's own, and dragging resizes.
setw -g mouse on

# Vi keys in copy mode, with y ending the selection like vim's yank.
setw -g mode-keys vi
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# OSC 52: tmux's buffer reaches your local clipboard when the outer terminal
# supports it. Silently does nothing when it does not, which is why this is safe
# to leave on for hosts you have never seen.
set -g set-clipboard on

# Let vim/nvim/tmux know when the window gained or lost focus.
set -g focus-events on
